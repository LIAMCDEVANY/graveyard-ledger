{% extends 'base.html' %}

{% block content %}

<div class="auth-box">
  <h1>Sign Up</h1>

  {% if error_message %}
    <p>{{ error_message }}</p>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Account</button>
  </form>
</div>

{% endblock %}
