{% extends 'base.html' %}

{% block content %}

<div class="auth-box">
  <h1>Delete Entry</h1>

  <p>Are you sure you want to delete "{{ entry.title }}"?</p>

  <form method="POST">
    {% csrf_token %}
    <button type="submit">Delete</button>
  </form>

  <br>

  <a href="/entries/{{ entry.id }}/">Cancel</a>
</div>

{% endblock %}
