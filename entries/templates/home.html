{% extends 'base.html' %}
{% load static %}

{% block content %}

<img src="{% static 'images/raven.png' %}" alt="Raven Logo" class="raven-logo">

<h1>Graveyard Ledger</h1>

<p class="home-copy">
  A place to bury thoughts, memories, regrets, and reflections.
  Graveyard Ledger is a dark personal archive built with Django.
</p>

{% if user.is_authenticated %}
  <a href="/entries/">
    <button>View Entries</button>
  </a>

  <a href="/entries/create/">
    <button>Create Entry</button>
  </a>
{% else %}
  <a href="/accounts/login/">
    <button>Login</button>
  </a>

  <a href="/accounts/signup/">
    <button>Sign Up</button>
  </a>
{% endif %}

{% endblock %}
